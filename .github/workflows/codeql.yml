# Code scanning on every push to main, every pull request into it, and a
# weekly sweep. Every language is analysed without a build (`build-mode:
# none`), so no toolchain beyond the extractor is installed.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '45 1 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      # Needed to fetch CodeQL packs and read workflow runs when the
      # repository is private; harmless when it is public.
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # The workflows, the bundled pi extensions and the marketing site, the
        # repo scripts, and the app itself.
        language: [actions, javascript-typescript, python, rust]
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Rust extraction is ~10x slower than the other three languages because the
    # extractor shells out to cargo: `LoadManifest` resolves the dependency
    # graph against the sparse registry index (~1 min on a cold runner) and
    # `ExtractLibrary` builds proc-macro dependencies from source (~1 min).
    # Both are network/warm-cache bound and repeat byte-for-byte between runs,
    # so the registry half is worth caching.
    #
    # Deliberately no `target/` cache (`cache-targets: false`): the extractor
    # runs with `cargo_target_dir: None` (its own per-run scratch dir), and
    # `build-mode: none` never compiles this workspace. Caching `target/` would
    # cost a multi-GB restore for no reuse and evict ci.yml's per-OS builds.
    - name: Cache cargo registry
      if: matrix.language == 'rust'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        prefix-key: codeql-rust
        cache-targets: "false"
        # PR runs only read the cache; writing from them would churn the
        # 10 GB budget every push and is keyed off the same Cargo.lock anyway.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        # Security *and* quality queries: the default suite reports only
        # security findings, which is why the code-quality view stays empty.
        queries: security-extended,security-and-quality
        # `build-mode: none` cannot resolve glob-imported constants (the
        # `windows`/AppKit `WM_*`, `VK_*`, `NSF*FunctionKey` match arms), so
        # `rust/unused-variable` reads every such arm as a fresh binding. rustc
        # already denies real unused variables through clippy `-D warnings`.
        config: |
          query-filters:
            - exclude:
                id: rust/unused-variable

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      with:
        category: "/language:${{matrix.language}}"
